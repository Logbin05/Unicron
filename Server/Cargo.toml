[package]
name = "Server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
axum = "0.8.6"
base64 = "0.22.1"
chrono = "0.4.42"
deadpool-redis = "0.22.0"
dotenvy = "0.15.7"
hyper = "1.8.1"
hyper-util = "0.1.19"
prost = "0.14.1"
prost-types = "0.14.1"
rdkafka = { version = "0.38.0", features = ["tokio"] }
redis = "0.32.7"
rustls = { version = "0.23.35", features = ["ring"] }
rustls-pemfile = "2.2.0"
rusty_paseto = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "time"] }
time = { version="0.3.45", features = ["formatting"]}
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time", "signal", "full"] }
tokio-rustls = "0.26.4"
tonic = "0.14.2"
tonic-prost = "0.14.2"
tonic-reflection = "0.14.3"
tower = "0.5.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
uuid = { version = "1.19.0", features = ["v4"]}

[build-dependencies]
tonic-prost-build = "0.14.2"
