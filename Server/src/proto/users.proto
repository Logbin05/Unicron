syntax = "proto3";
package users;

import "google/protobuf/timestamp.proto";
import "common.proto";

message Role {
  int64 role_id = 1;
  string role_name = 2;
}

message User {
  int64 user_id = 1;
  int64 role_id = 2;
  string full_name = 3;
  string login = 4;
  string email = 5;
  string avatar = 6;
  bool is_verified = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message UserFinance {
  int64 uf_id = 1;
  int64 user_id = 2;
  string card_id = 3;
  string currency = 4;
  double balance = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}


message Log {
  int64 log_id = 1;
  int64 user_id = 2;
  string action = 3;
  common.Meta meta = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CreateNewUserReq {
  string full_name = 1;
  string login = 2;
  string email = 3;
  string password_hash = 4;
}

message CreateNewUserRes {
  User user = 1;
}

message GetUserReq {
  int64 user_id = 1;
}

message GetUserRes {
  User user = 1;
}

message UpdateUserReq {
  int64 user_id = 1;
  int64 role_id = 2;
  string full_name = 3;
  string login = 4;
  string email = 5;
  string avatar = 6;
  bool is_verified = 7;
}

message UpdatePasswordReq {
  int64 user_id = 1;
  string old_password_hash = 2;
  string new_password_hash = 3;
}

message UpdatePasswordRes {
  bool success = 1;
}

message UpdateUserRes {
  User user = 1;
}

message VerifyUserReq {
  int64 user_id = 1;
}

message VerifyUserRes {
  bool success = 1;
}

message RegisterReq {
  string full_name = 1;
  string login = 2;
  string email = 3;
  string password = 4;
}

message RegisterRes {
  User user = 1;
  string token = 2;
}

message LoginReq {
  string login_or_email = 1;
  string password = 2;
}

message LoginRes {
  User user = 1;
  string token = 2;
}

service AuthService {
  rpc Register(RegisterReq) returns (RegisterRes);
  rpc Login(LoginReq) returns (LoginRes);
}

service UserService {
  rpc CreateUser(CreateNewUserReq) returns (CreateNewUserRes);
  rpc GetUser(GetUserReq) returns (GetUserRes);
  rpc UpdateUser (UpdateUserReq) returns (UpdateUserRes);
  rpc UpdatePassword(UpdatePasswordReq) returns (UpdatePasswordRes);
  rpc VerifyUser(VerifyUserReq) returns (VerifyUserRes);
}