syntax = "proto3";
package auth;

import "google/protobuf/timestamp.proto";
import "users.proto";

message RegisterReq {
  string full_name = 1;
  string login = 2;
  string email = 3;
  string password = 4;
}

message RegisterRes {
  users.User user = 1;
  string token = 2;
}

message LoginReq {
  string login_or_email = 1;
  string password = 2;
}

message LoginRes {
  users.User user = 1;
  string token = 2;
}

service AuthService {
  rpc Register(RegisterReq) returns (RegisterRes);
  rpc Login(LoginReq) returns (LoginRes);
}